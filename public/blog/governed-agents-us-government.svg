<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 816" width="1456" height="816" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090d"/><stop offset="1" stop-color="#0d1017"/></linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a4d"/><stop offset="0.6" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ff5c72"/></linearGradient>
  </defs>
  <rect width="1456" height="816" fill="url(#bg)"/>

  <text x="96" y="120" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="4" fill="#ff8a3d">TREND REPORT</text>
  <text x="96" y="196" font-size="56" font-weight="600" fill="#eef1f7" letter-spacing="-1.5">Delivering AI Agents in the US Government</text>
  <text x="96" y="244" font-size="24" fill="#9aa3b2">Agents are reaching production faster than the controls around them.</text>

  <!-- 100% = 1000px, bars start at x=96 -->
  <text x="96" y="372" font-size="20" fill="#9aa3b2">Use agentic AI in at least one production workflow</text>
  <rect x="96" y="392" width="1000" height="56" rx="6" fill="#141826"/>
  <rect x="96" y="392" width="450" height="56" rx="6" fill="url(#sunset)"/>
  <text x="1124" y="436" font-family="ui-monospace, Menlo, monospace" font-size="44" font-weight="600" fill="#eef1f7">45%</text>

  <text x="96" y="534" font-size="20" fill="#9aa3b2">Have a defined incident response framework for agents</text>
  <rect x="96" y="554" width="1000" height="56" rx="6" fill="#141826"/>
  <rect x="96" y="554" width="80" height="56" rx="6" fill="#5f6a80"/>
  <text x="1124" y="598" font-family="ui-monospace, Menlo, monospace" font-size="44" font-weight="600" fill="#eef1f7">8%</text>

  <line x1="96" y1="690" x2="1360" y2="690" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="96" y="726" font-size="14" fill="#6b7382">Two separate surveys of federal technology leaders. Production use: ICF and MeriTalk, October 2026 (n=100).</text>
  <text x="96" y="748" font-size="14" fill="#6b7382">Incident response: Market Connections, sponsored by ServiceNow, reported May 2026 (n&gt;200).</text>
</svg>
